<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사용자 맞춤형 격자 러닝코스 추천</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <p class="eyebrow">SEOUL RUNNING COURSE</p>
        <h1>사용자 맞춤형 격자 러닝코스 추천</h1>
      </div>
      <div class="controls" aria-label="경로 조건">
        <label class="control">
          <span>날짜</span>
          <input id="date-input" type="date">
        </label>
        <label class="control">
          <span>시간</span>
          <select id="hour-input">
            <option value="">선택</option>
          </select>
        </label>
        <fieldset class="choice-group">
          <legend>목표 거리</legend>
          <label><input type="radio" name="distance" value="3"> <span>3km</span></label>
          <label><input type="radio" name="distance" value="5"> <span>5km</span></label>
        </fieldset>
        <fieldset class="choice-group">
          <legend>출발지</legend>
          <label><input type="radio" name="start-mode" value="current"> <span>현재 위치 격자</span></label>
          <label><input type="radio" name="start-mode" value="best_within_1km"> <span>1km 이내 최고 Score</span></label>
        </fieldset>
        <fieldset class="choice-group run-type-group">
          <legend>러닝 유형</legend>
          <label><input type="radio" name="run-type" value="basic_recommendation" checked> <span>기본 추천</span></label>
          <label><input type="radio" name="run-type" value="recovery_beginner"> <span>회복 초보 러닝</span></label>
          <label><input type="radio" name="run-type" value="pb_record"> <span>기록 PB 러닝</span></label>
          <label><input type="radio" name="run-type" value="hill_training"> <span>경사 선호 코스</span></label>
          <label><input type="radio" name="run-type" value="scenic_run"> <span>경관 러닝</span></label>
          <label><input type="radio" name="run-type" value="long_run"> <span>Long Run</span></label>
        </fieldset>
        <button id="route-button" type="button">경로 탐색</button>
      </div>
    </header>

    <section class="map-wrap" aria-label="서울 250m 격자 지도">
      <div id="map"></div>
      <div class="map-note">실제 점수 데이터 · 유형별 가중치 적용</div>
      <div class="legend" aria-label="최종 점수 범례">
        <span>낮은 점수</span><i></i><span>높은 점수</span>
      </div>

      <aside class="route-panel" aria-live="polite">
        <p class="panel-kicker">ROUTE STATUS</p>
        <h2 id="route-title">조건을 선택하고 지도를 클릭하세요</h2>
        <p id="route-detail">날짜, 시간, 목표 거리, 출발지를 고른 뒤 현재 위치를 지도에 지정합니다.</p>
        <dl id="route-summary" class="summary-list"></dl>
        <div id="route-stop" class="route-stop" hidden></div>
      </aside>
    </section>
  </main>

  <div id="validation-modal" class="validation-modal" hidden role="dialog" aria-modal="true" aria-labelledby="validation-title">
    <div class="validation-dialog">
      <p class="panel-kicker">ROUTE CHECK</p>
      <h2 id="validation-title">선택하지 않은 항목이 있어요</h2>
      <p>경로를 탐색하려면 아래 항목을 선택해주세요.</p>
      <ul id="missing-conditions" class="missing-conditions"></ul>
      <button id="validation-close" type="button">확인</button>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
